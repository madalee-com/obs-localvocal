name: Flatpak Extension Build
# Builds com.obsproject.Studio.Plugin.LocalVocal as a Flatpak EXTENSION.
# Runs on GitHub-hosted ubuntu runners (O_TMPFILE supported), where flatpak can
# pull the OBS Studio runtime + org.freedesktop.Sdk//25.08 + rust-stable.
#
# This is an EXTENSION build, not an app build:
#   - manifest has build-extension: true and bundles NO OBS-platform ref,
#   - we bundle a slim-ish .flatpak from flatpak-builder's export repo (repo/),
#     anchored on the extension's own runtime ref, NOT via upload-artifact of raw files.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak.yaml'
    # Numeric version tags (e.g. 0.6.3, no "v" prefix) trigger build + auto-release.
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: read

jobs:
  flatpak-build:
    name: Build Flatpak Extension 📦
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub runners forbid system-scope flatpak ops ("not allowed for user"),
      # so everything lives in a per-run user dir instead.
      FLATPAK_USER_DIR: ${{ github.workspace }}/.flatpak-user
    steps:
      - name: Checkout 🍴
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install flatpak tooling 🛠️
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder patchelf gnome-software-plugin-flatpak

      - name: Add flathub remote (user) 🌐
        run: |
          mkdir -p "${FLATPAK_USER_DIR}"
          # User scope only -- system scope is disabled on GitHub-hosted runners.
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak update --noninteractive --user

      - name: Install OBS Studio runtime + SDK + rust-stable (user) 🔧
        run: |
          mkdir -p "${FLATPAK_USER_DIR}"
          # Runtime the extension builds against
          flatpak install --noninteractive --user flathub com.obsproject.Studio//stable
          # Build SDK (must match the OBS runtime) and Rust extension
          flatpak install --noninteractive --user flathub org.freedesktop.Sdk//25.08
          flatpak install --noninteractive --user flathub org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build extension with flatpak-builder 🏗️
        run: |
          # User scope to match the runtimes installed above; --force-clean for a
          # reproducible build. Explicitly write the export (write-only) ostree repo
          # into flatpak-build/repo via --repo=DIR. With --user scope and no explicit
          # --repo, flatpak-builder's commit emitted no "<hash> to <builddir>/repo" line
          # and left no repo/ behind, which is exactly why bundling from the export
          # repo previously failed. --repo=DIR forces the named export repo to exist.
          rm -rf flatpak-build && mkdir -p flatpak-build
          flatpak-builder --user --force-clean \
            --repo=flatpak-build/repo \
            flatpak-build ./flatpak/com.obsproject.Studio.Plugin.LocalVocal.yaml

      - name: Inspect built extension tree 📂
        run: |
          echo "=== all files under flatpak-build ==="
          find flatpak-build \( -type f -o -type l \) | sed 's#^flatpak-build/##' | sort
          echo "=== the .so files specifically ==="
          find flatpak-build -name '*.so*' -path '*LocalVocal*' || true

      - name: Bundle extension from export repo 📦
        # bundle a proper .flatpak (single file, valid metadata) from the NAMED export
        # repo committed by flatpak-builder (--export=repo), anchored on the EXTENSION's
        # own runtime ref (.Plugin.LocalVocal/...), NOT the OBS platform ref. We never
        # use upload-artifact of raw files, and never re-add bloat via --runtime-repo.
        run: |
          set -euo pipefail
          mkdir -p out
          if [ ! -d flatpak-build/repo ]; then
            echo "ERROR: no export repo at flatpak-build/repo (commit may have failed)" >&2
            exit 1
          fi
          # The extension's runtime ref in the export repo.
          REF=$(ostree --repo=flatpak-build/repo refs 2>/dev/null \
                | grep -E "com\.obsproject\.Studio\.Plugin\.LocalVocal/" || true)
          if [ -z "$REF" ]; then
            echo "ERROR: no .Plugin.LocalVocal ref in export repo" >&2
            ostree --repo=flatpak-build/repo refs 2>&1 | sed 's/^/  ref: /' >&2 || true
            exit 1
          fi
          echo "Anchoring bundle on ref=$REF"
          flatpak build-bundle flatpak-build/repo out/com.obsproject.Studio.Plugin.LocalVocal.flatpak "$REF" stable
          ls -lh out/com.obsproject.Studio.Plugin.LocalVocal.flatpak

      - name: Upload extension artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: obs-localvocal-flatpak-extension
          path: |
            out/com.obsproject.Studio.Plugin.LocalVocal.flatpak
          if-no-files-found: error

  release:
    name: Publish Flatpak Release 🛫
    # Only fire on a numeric version tag push so tagging 0.6.3 also publishes the flatpak
    # release with notes. Manual dispatch just builds + uploads the artifact.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: flatpak-build
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is REQUIRED so `git log` has full history; a shallow depth-1 clone yields
      # only HEAD and produces an empty changelog body.
      - name: Checkout 🍴
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download flatpak artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: obs-localvocal-flatpak-extension
          path: release

      - name: Derive version from tag 🏷️
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build changelog from git history 📝
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Previous release = the next-lower semver tag (handles multi-digit components via sort -V).
          PREV=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V -r \
            | awk -v v="$VERSION" 'found==1 {print; exit} $0==v {found=1}')
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "# LocalVocal for OBS ${VERSION}"
            echo
            echo "Flatpak extension for the OBS Studio LocalVocal plugin."
            echo
            echo "## Changelog (${RANGE})"
            echo
            git log --pretty=format:'- %s (%h)' -n 100 $RANGE
          } > changelog.md
          echo "----- changelog -----"
          cat changelog.md

      - name: Publish release with notes 📤
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: LocalVocal for OBS Flatpak ${{ steps.version.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            release/com.obsproject.Studio.Plugin.LocalVocal.flatpak
