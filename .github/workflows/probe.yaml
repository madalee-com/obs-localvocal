name: Flatpak Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: install flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder patchelf
          echo "INSTALL_EXIT=$?"
          which flatpak flatpak-builder
          flatpak --version
      - name: probe scopes
        run: |
          set +e
          echo "whoami=$(whoami) id=$(id -u)"
          echo "--- system remote-add ---"
          flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo; echo "system_EXIT=$?"
          echo "--- user remote-add (default FLATPAK_USER_DIR) ---"
          echo "FLATPAK_USER_DIR=${FLATPAK_USER_DIR:-<unset>}"
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo; echo "user_EXIT=$?"
          echo "--- user remote-add (explicit /tmp/fl) ---"
          mkdir -p /tmp/fl
          FLATPAK_USER_DIR=/tmp/fl flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo; echo "custom_EXIT=$?"
          echo "--- list remotes ---"
          flatpak remotes
